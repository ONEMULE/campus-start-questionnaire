# Include this file in the existing http context; NEVER overwrite nginx.conf.
log_format @@ZONE@@_minimal '$time_iso8601 $request_method $uri $status $request_time';
limit_req_zone $binary_remote_addr zone=@@ZONE@@_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=@@ZONE@@_api:10m rate=30r/s;
server {
    listen 80;
    server_name @@DOMAIN@@;
    location ^~ /.well-known/acme-challenge/ { root @@ACME_ROOT@@; }
    location / { return 301 https://@@DOMAIN@@$request_uri; }
}
server {
    listen 443 ssl;
    server_name @@DOMAIN@@;
    ssl_certificate @@TLS_FULLCHAIN@@;
    ssl_certificate_key @@TLS_KEY@@;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    limit_req_status 429;
    access_log /var/log/nginx/@@SITE_ID@@.access.log @@ZONE@@_minimal;
    error_log /var/log/nginx/@@SITE_ID@@.error.log warn;
    error_page 502 503 504 /__maintenance.html;
    location = /__maintenance.html { internal; alias @@EDGE_STATIC@@/maintenance.html; }
    location = /api/admin/login {
        @@ADMIN_ALLOW@@
        limit_req zone=@@ZONE@@_login burst=5 nodelay;
        include @@NGINX_DIR@@/@@SITE_ID@@.proxy.conf;
    }
    location ^~ /api/admin/ {
        @@ADMIN_ALLOW@@
        include @@NGINX_DIR@@/@@SITE_ID@@.proxy.conf;
    }
    location = /admin {
        @@ADMIN_ALLOW@@
        include @@NGINX_DIR@@/@@SITE_ID@@.proxy.conf;
    }
    location /api/ {
        # Leave burst headroom for many students behind one campus NAT address.
        limit_req zone=@@ZONE@@_api burst=300 nodelay;
        include @@NGINX_DIR@@/@@SITE_ID@@.proxy.conf;
    }
    location / { include @@NGINX_DIR@@/@@SITE_ID@@.proxy.conf; }
}
